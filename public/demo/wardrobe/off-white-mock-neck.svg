<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Off-White Mock Neck</title>
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7e1d4"/>
      <stop offset=".42" stop-color="#e2dacb"/>
      <stop offset="1" stop-color="#b0aa9e"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#171714" flood-opacity=".16"/>
    </filter>
    <filter id="fabric" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="356" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values=".08 0 0 0 .45  0 .08 0 0 .45  0 0 .08 0 .45  0 0 0 .13 0" result="softNoise"/>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
  </defs>
  <style>.garment{--detail:#c6baa7;filter:url(#soft-shadow)}.garment&gt;*{vector-effect:non-scaling-stroke}.garment{stroke:#b0aa9e;stroke-width:1.15;stroke-linejoin:round;stroke-linecap:round}.garment{filter:url(#soft-shadow)}</style>
  <g filter="url(#fabric)"><g class="garment"><path d="M169 124L216 91Q256 116 296 91L343 124L393 162L429 386L374 399L328 202L334 434Q256 459 178 434L184 202L138 399L83 386L119 162Z" fill="url(#cloth)"/><path d="M226 96h60v62q-30 17-60 0z" fill="var(--detail)" opacity=".72"/><g stroke="var(--detail)" opacity=".3"><path d="M178 410q78 23 156 0" stroke-width="12"/><path d="M92 374l50-12M370 362l50 12" stroke-width="10"/></g></g></g>
</svg>