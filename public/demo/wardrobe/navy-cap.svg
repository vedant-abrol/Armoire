<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Navy Cap</title>
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#596575"/>
      <stop offset=".42" stop-color="#344357"/>
      <stop offset="1" stop-color="#293444"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#171714" flood-opacity=".16"/>
    </filter>
    <filter id="fabric" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="469" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values=".08 0 0 0 .45  0 .08 0 0 .45  0 0 .08 0 .45  0 0 0 .13 0" result="softNoise"/>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
  </defs>
  <style>.garment{--detail:#637085;filter:url(#soft-shadow)}.garment&gt;*{vector-effect:non-scaling-stroke}.garment{stroke:#293444;stroke-width:1.15;stroke-linejoin:round;stroke-linecap:round}.garment{filter:url(#soft-shadow)}</style>
  <g filter="url(#fabric)"><g class="garment"><path d="M132 282q13-151 137-158 111 8 122 150-132 49-259 8z" fill="url(#cloth)"/><path d="M253 276q118-32 195 15-99 74-215 20z" fill="var(--detail)"/><path d="M270 124v150M164 183q105 24 204-2" fill="none" stroke="var(--detail)" opacity=".4"/></g></g>
</svg>