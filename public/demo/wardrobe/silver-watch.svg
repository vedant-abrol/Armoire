<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Silver Watch</title>
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4c6c4"/>
      <stop offset=".42" stop-color="#b7b9b7"/>
      <stop offset="1" stop-color="#8f908f"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#171714" flood-opacity=".16"/>
    </filter>
    <filter id="fabric" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="645" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values=".08 0 0 0 .45  0 .08 0 0 .45  0 0 .08 0 .45  0 0 0 .13 0" result="softNoise"/>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
  </defs>
  <style>.garment{--detail:#404341;filter:url(#soft-shadow)}.garment&gt;*{vector-effect:non-scaling-stroke}.garment{stroke:#8f908f;stroke-width:1.15;stroke-linejoin:round;stroke-linecap:round}.garment{filter:url(#soft-shadow)}</style>
  <g filter="url(#fabric)"><g class="garment"><path d="M224 43h64l19 150-20 32 20 94-19 150h-64l-19-150 20-94-20-32z" fill="url(#cloth)"/><circle cx="256" cy="256" r="91" fill="#404341"/><circle cx="256" cy="256" r="75" fill="#c3c4c3" stroke="#727472" stroke-width="7"/><path d="M256 256l4-49M256 256l38 22" stroke="#232524" stroke-width="7" stroke-linecap="round"/></g></g>
</svg>