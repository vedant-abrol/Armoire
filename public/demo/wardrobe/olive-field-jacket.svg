      <stop offset="0" stop-color="#777d6b"/>
      <stop offset=".42" stop-color="#59604b"/>
      <stop offset="1" stop-color="#454b3b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
