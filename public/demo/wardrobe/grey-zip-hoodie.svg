<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Grey Zip Hoodie</title>
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ababa8"/>
      <stop offset=".42" stop-color="#989895"/>
      <stop offset="1" stop-color="#777774"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#171714" flood-opacity=".16"/>
    </filter>
    <filter id="fabric" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="392" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values=".08 0 0 0 .45  0 .08 0 0 .45  0 0 .08 0 .45  0 0 0 .13 0" result="softNoise"/>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
  </defs>
  <style>.garment{--detail:#c0bfba;filter:url(#soft-shadow)}.garment&gt;*{vector-effect:non-scaling-stroke}.garment{stroke:#777774;stroke-width:1.15;stroke-linejoin:round;stroke-linecap:round}.garment{filter:url(#soft-shadow)}</style>
  <g filter="url(#fabric)"><g class="garment"><path d="M196 126Q198 58 256 48Q314 58 316 126L288 157H224Z" fill="url(#cloth)" opacity=".96"/><path d="M221 123Q219 80 256 70Q293 80 291 123" fill="none" stroke="var(--detail)" opacity=".42"/><path d="M168 122L213 91Q256 117 299 91L344 122L396 160L431 389L376 403L328 202L337 439Q256 465 175 439L184 202L136 403L81 389L116 160Z" fill="url(#cloth)"/><path d="M256 134v306" stroke="var(--detail)" stroke-width="5" opacity=".62"/><path d="M183 311l52-30M329 311l-52-30" stroke="var(--detail)" stroke-width="4" opacity=".52"/></g></g>
</svg>